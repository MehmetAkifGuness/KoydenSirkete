name: Flutter quality

on:
  pull_request:
    paths: ["mobile/**", ".github/workflows/flutter-quality.yml"]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  automated-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: dart tool/verify_domain_test_coverage.dart
      - run: dart tool/verify_class_size.dart
      - run: dart tool/verify_project_hygiene.dart
      - run: dart tool/verify_turkish_formatting.dart
      - run: dart tool/verify_release_readiness.dart
      - run: flutter test

  physical-android-smoke:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: automated-quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: low
            runner: android-low
          - tier: mid
            runner: android-mid
          - tier: high
            runner: android-high
    runs-on: [self-hosted, android-device, "${{ matrix.runner }}"]
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Require a physical Android device
        shell: bash
        run: |
          test -n "$ANDROID_DEVICE_ID"
          test "$(adb -s "$ANDROID_DEVICE_ID" shell getprop ro.kernel.qemu | tr -d '\r')" != "1"
          adb -s "$ANDROID_DEVICE_ID" get-state
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Profile startup, scrolling, animation and large-save latency
        run: flutter test integration_test/performance_smoke_test.dart -d "$ANDROID_DEVICE_ID" --dart-define=PERFORMANCE_TIER=${{ matrix.tier }} --profile
      - name: Run real-device release smoke
        run: flutter test integration_test/release_smoke_test.dart -d "$ANDROID_DEVICE_ID" --profile
